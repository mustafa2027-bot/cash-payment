<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Payment Dashboard</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f5f5f5; }
    .dashboard { max-width: 500px; margin: 40px auto; background: #fff; padding: 32px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    h2 { color: #444; margin-bottom: 24px; }
    .summary { margin-bottom: 32px; }
    .summary span { display: block; margin-bottom: 8px; font-size: 18px; }
    .payments-table { width: 100%; border-collapse: collapse; }
    .payments-table th, .payments-table td { border: 1px solid #ddd; padding: 8px; }
    .payments-table th { background: #f0f0f0; }
  </style>
</head>
<body>
  <div class="dashboard">
    <h2>Payment Dashboard</h2>
    <div class="summary">
      <span>Total Payments: <strong id="totalPayments">0</strong></span>
      <span>Total Amount: $<strong id="totalAmount">0.00</strong></span>
    </div>
    <table class="payments-table">
      <thead>
        <tr>
          <th>Date</th>
          <th>Customer</th>
          <th>Amount</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="paymentsBody">
        <!-- Payment rows go here -->
      </tbody>
    </table>
  </div>
  <script>
    // Sample payment data
    const payments = [
      { date: "2025-10-01", customer: "Alice", amount: 120.00, status: "Completed" },
      { date: "2025-10-02", customer: "Bob", amount: 75.50, status: "Pending" },
      { date: "2025-10-03", customer: "Charlie", amount: 210.25, status: "Completed" }
    ];

    const paymentsBody = document.getElementById('paymentsBody');
    let totalPayments = 0, totalAmount = 0;
    payments.forEach(payment => {
      totalPayments++;
      totalAmount += payment.amount;
      const row = document.createElement('tr');
      row.innerHTML = `
        <td>${payment.date}</td>
        <td>${payment.customer}</td>
        <td>$${payment.amount.toFixed(2)}</td>
        <td>${payment.status}</td>
      `;
      paymentsBody.appendChild(row);
    });

    document.getElementById('totalPayments').textContent = totalPayments;
    document.getElementById('totalAmount').textContent = totalAmount.toFixed(2);
  </script>
</body>
</html>
